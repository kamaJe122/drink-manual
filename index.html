<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金茂宜咖啡 · 小金人學習手冊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Noto+Serif+TC:wght@400;500;600;700;900&family=DM+Mono:wght@400;500;600&display=swap" rel="stylesheet">
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
            
            :root {
                --bg: #faf7f2;
                --paper: #ffffff;
                --ink: #3a2a1a;
                --ink-soft: #8a7560;
                --ink-mid: #6b5640;
                --line: #e8ddd0;
                --line-soft: #f0e8dc;
                --accent: #c8813a;
                --accent-soft: #f5e6d0;
                --accent-light: #fbf2e3;
                --gold: #d4a574;
                --green: #7ba36a;
                --green-soft: #d9e7d2;
                --ice-bg: #e3eef5;
                --ice-tx: #4a7a96;
                --hot-bg: #f5dcc8;
                --hot-tx: #a85a32;
            }
            
            html, body { height: 100%; }
            body {
                font-family: 'Noto Serif TC', serif;
                background: var(--bg);
                color: var(--ink);
                line-height: 1.55;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                overflow-x: hidden;
            }
            
            /* ============ Auth 畫面 ============ */
            .auth-screen {
                position: fixed;
                inset: 0;
                background: var(--bg);
                z-index: 1000;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px;
            }
            
            .auth-card {
                width: 100%;
                max-width: 360px;
                background: var(--paper);
                border-radius: 20px;
                padding: 28px 24px;
                box-shadow: 0 20px 50px rgba(58,42,26,0.1);
                border: 1px solid var(--line);
            }
            
            .auth-brand {
                text-align: center;
                margin-bottom: 22px;
            }
            
            .auth-brand h1 {
                font-family: 'DM Serif Display', serif;
                font-weight: 400;
                font-size: 28px;
                color: var(--ink);
                margin-bottom: 4px;
            }
            
            .auth-brand .zh {
                font-family: 'Noto Serif TC', serif;
                font-weight: 600;
                font-size: 12px;
                color: var(--ink-soft);
                letter-spacing: 0.3em;
            }
            
            .auth-tabs {
                display: flex;
                gap: 4px;
                background: var(--bg);
                border-radius: 12px;
                padding: 4px;
                margin-bottom: 20px;
            }
            
            .auth-tab {
                flex: 1;
                padding: 8px;
                background: transparent;
                border: none;
                border-radius: 8px;
                color: var(--ink-mid);
                font-family: 'Noto Serif TC', serif;
                font-weight: 600;
                font-size: 13px;
                cursor: pointer;
                transition: all 0.2s;
            }
            
            .auth-tab.active {
                background: var(--ink);
                color: var(--paper);
            }
            
            .role-pick {
                display: flex;
                gap: 8px;
                margin-bottom: 18px;
            }
            
            .role-btn {
                flex: 1;
                padding: 14px 8px;
                border: 2px solid var(--line);
                background: var(--paper);
                border-radius: 12px;
                cursor: pointer;
                transition: all 0.2s;
                text-align: center;
            }
            
            .role-btn .role-emoji {
                font-size: 28px;
                display: block;
                margin-bottom: 4px;
            }
            
            .role-btn .role-name {
                font-family: 'Noto Serif TC', serif;
                font-size: 13px;
                font-weight: 600;
                color: var(--ink);
            }
            
            .role-btn .role-desc {
                font-size: 10px;
                color: var(--ink-soft);
                margin-top: 2px;
            }
            
            .role-btn.active {
                border-color: var(--accent);
                background: var(--accent-light);
            }
            
            .form-field {
                margin-bottom: 12px;
            }
            
            .form-label {
                font-family: 'DM Mono', monospace;
                font-size: 10px;
                letter-spacing: 0.15em;
                color: var(--ink-soft);
                font-weight: 600;
                margin-bottom: 5px;
                display: block;
                text-transform: uppercase;
            }
            
            .form-input {
                width: 100%;
                padding: 10px 12px;
                background: var(--bg);
                border: 1px solid var(--line);
                border-radius: 10px;
                font-family: 'Noto Serif TC', serif;
                font-size: 14px;
                color: var(--ink);
                transition: border-color 0.2s;
            }
            
            .form-input:focus {
                outline: none;
                border-color: var(--accent);
            }
            
            .auth-submit {
                width: 100%;
                padding: 12px;
                background: var(--ink);
                color: var(--paper);
                border: none;
                border-radius: 10px;
                font-family: 'Noto Serif TC', serif;
                font-weight: 700;
                font-size: 14px;
                cursor: pointer;
                margin-top: 8px;
                transition: all 0.2s;
            }
            
            .auth-submit:hover {
                background: var(--accent);
            }
            
            .auth-msg {
                font-size: 12px;
                color: var(--accent);
                text-align: center;
                margin-top: 10px;
                min-height: 16px;
            }
            
            /* ============ 頂部品牌列 ============ */
            .topbar {
                flex-shrink: 0;
                padding: 10px 14px;
                background: var(--paper);
                border-bottom: 1px solid var(--line);
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 8px;
            }
            
            .topbar-brand {
                display: flex;
                align-items: center;
                gap: 8px;
                min-width: 0;
            }
            
            .topbar-brand h1 {
                font-family: 'DM Serif Display', serif;
                font-weight: 400;
                font-size: 16px;
                color: var(--ink);
                line-height: 1;
                white-space: nowrap;
            }
            
            .topbar-brand .zh {
                font-family: 'Noto Serif TC', serif;
                font-weight: 500;
                font-size: 10px;
                color: var(--ink-soft);
                letter-spacing: 0.15em;
                border-left: 1px solid var(--line);
                padding-left: 8px;
                white-space: nowrap;
            }
            
            .topbar-user {
                display: flex;
                align-items: center;
                gap: 6px;
                flex-shrink: 0;
            }
            
            .user-chip {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                padding: 4px 6px 4px 4px;
                background: var(--accent-light);
                border-radius: 999px;
                font-size: 11px;
                font-weight: 600;
                color: var(--accent);
                cursor: pointer;
            }
            .user-rank {
                background: linear-gradient(135deg, var(--accent), #b76a2a);
                color: white;
                padding: 3px 8px;
                border-radius: 999px;
                font-family: 'Noto Serif TC', serif;
                font-weight: 700;
                font-size: 11px;
                white-space: nowrap;
            }
            .user-xp {
                font-family: 'DM Mono', monospace;
                font-size: 10px;
                color: var(--ink);
                font-weight: 700;
                padding: 0 4px;
                border-right: 1px solid var(--accent-soft);
            }
            .user-name {
                font-family: 'Noto Serif TC', serif;
                color: var(--ink);
                font-size: 11px;
                font-weight: 700;
                padding-right: 4px;
            }
            
            /* 響應式：手機螢幕小，把 XP 隱藏 */
            @media (max-width: 420px) {
                .user-xp { display: none; }
            }
            @media (max-width: 360px) {
                .user-name { display: none; }
            }
            
            .icon-btn {
                width: 28px;
                height: 28px;
                border-radius: 50%;
                border: 1px solid var(--line);
                background: var(--paper);
                cursor: pointer;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                font-size: 14px;
                transition: all 0.2s;
            }
            .icon-btn:hover {
                border-color: var(--accent);
                background: var(--accent-light);
            }
            
            /* ============ 上方主導覽（手冊／我的學習／聯絡簿） ============ */
            .main-nav {
                flex-shrink: 0;
                display: flex;
                background: var(--paper);
                border-bottom: 1px solid var(--line);
            }
            
            .main-nav-btn {
                flex: 1;
                padding: 10px 4px;
                background: transparent;
                border: none;
                border-bottom: 2px solid transparent;
                color: var(--ink-soft);
                font-family: 'Noto Serif TC', serif;
                font-weight: 600;
                font-size: 12px;
                cursor: pointer;
                transition: all 0.2s;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 4px;
            }
            
            .main-nav-btn.active {
                color: var(--accent);
                border-bottom-color: var(--accent);
            }
            
            .main-nav-btn .nv-emoji { font-size: 14px; }
            
            /* ============ 分類 Tab Bar ============ */
            .tabs-wrap {
                flex-shrink: 0;
                background: var(--bg);
                border-bottom: 1px solid var(--line);
                padding: 8px 0;
            }
            .tabs-scroll {
                position: relative;
                overflow: hidden;
            }
            .tabs-scroll::before, .tabs-scroll::after {
                content: '';
                position: absolute;
                top: 0; bottom: 0; width: 24px; z-index: 2; pointer-events: none;
            }
            .tabs-scroll::before { left: 0; background: linear-gradient(90deg, var(--bg), transparent); }
            .tabs-scroll::after { right: 0; background: linear-gradient(-90deg, var(--bg), transparent); }
            
            .tabs {
                display: flex;
                gap: 5px;
                padding: 2px 14px;
                overflow-x: auto;
                scrollbar-width: none;
                scroll-behavior: smooth;
            }
            .tabs::-webkit-scrollbar { display: none; }
            
            .tab {
                flex-shrink: 0;
                padding: 6px 12px;
                background: var(--paper);
                border: 1px solid var(--line);
                border-radius: 999px;
                color: var(--ink-mid);
                font-family: 'Noto Serif TC', serif;
                font-weight: 500;
                font-size: 12.5px;
                cursor: pointer;
                transition: all 0.2s;
                white-space: nowrap;
                display: inline-flex;
                align-items: center;
                gap: 4px;
            }
            .tab:hover { background: var(--accent-light); border-color: var(--accent-soft); color: var(--accent); }
            .tab.active {
                background: var(--ink);
                color: var(--paper);
                border-color: var(--ink);
                box-shadow: 0 4px 10px rgba(58,42,26,0.15);
            }
            .tab .tab-emoji { font-size: 13px; }
            .tab .tab-count {
                font-family: 'DM Mono', monospace;
                font-size: 9px;
                opacity: 0.7;
                margin-left: 2px;
            }
            
            /* ============ 品項橫向滑動列 ============ */
            .items-wrap {
                flex-shrink: 0;
                background: var(--paper);
                border-bottom: 1px solid var(--line);
                padding: 8px 0;
            }
            .items-scroll {
                position: relative;
                overflow: hidden;
            }
            .items-scroll::before, .items-scroll::after {
                content: '';
                position: absolute;
                top: 0; bottom: 0; width: 20px; z-index: 2; pointer-events: none;
            }
            .items-scroll::before { left: 0; background: linear-gradient(90deg, var(--paper), transparent); }
            .items-scroll::after { right: 0; background: linear-gradient(-90deg, var(--paper), transparent); }
            
            .items-list {
                display: flex;
                gap: 5px;
                padding: 4px 14px;
                overflow-x: auto;
                scrollbar-width: none;
                scroll-behavior: smooth;
            }
            .items-list::-webkit-scrollbar { display: none; }
            
            .item-chip {
                flex-shrink: 0;
                padding: 8px 12px;
                background: var(--bg);
                border: 1px solid var(--line);
                border-radius: 12px;
                cursor: pointer;
                transition: all 0.2s;
                white-space: nowrap;
                display: inline-flex;
                align-items: center;
                gap: 6px;
                position: relative;
            }
            
            .item-chip:hover {
                background: var(--accent-light);
                border-color: var(--accent-soft);
            }
            
            .item-chip.active {
                background: var(--accent-light);
                border-color: var(--accent);
                box-shadow: 0 3px 8px rgba(200,129,58,0.15);
            }
            
            .item-chip .ic-emoji { font-size: 16px; }
            .item-chip .ic-name {
                font-family: 'Noto Serif TC', serif;
                font-weight: 600;
                font-size: 13px;
                color: var(--ink);
            }
            
            .item-chip .ic-count {
                font-family: 'DM Mono', monospace;
                font-size: 9px;
                background: var(--accent);
                color: white;
                padding: 1px 5px;
                border-radius: 999px;
                font-weight: 700;
                min-width: 18px;
                text-align: center;
            }
            .item-chip.learning {
                border-color: var(--accent-soft);
                background: linear-gradient(135deg, var(--paper), var(--accent-light));
            }
            .item-chip .ic-badge {
                font-family: 'DM Mono', monospace;
                font-size: 8px;
                background: var(--green);
                color: white;
                padding: 1px 4px;
                border-radius: 3px;
                font-weight: 600;
            }
            
            /* 解鎖狀態 */
            .item-chip.locked .ic-name {
                color: var(--ink-soft);
            }
            .item-chip.locked .ic-emoji {
                filter: grayscale(0.7);
                opacity: 0.6;
            }
            
            .item-chip .ic-lock {
                font-size: 11px;
                color: var(--ink-soft);
                margin-left: 2px;
            }
            
            .item-chip.completed::after {
                content: '✓';
                position: absolute;
                top: -4px;
                right: -4px;
                background: var(--green);
                color: white;
                font-size: 9px;
                width: 14px;
                height: 14px;
                border-radius: 50%;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                font-weight: 700;
                border: 2px solid var(--paper);
            }
            
            /* ============ 內容主區 ============ */
            .content {
                flex: 1;
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
                padding: 16px 18px 40px;
                background: var(--bg);
            }
            .content::-webkit-scrollbar { width: 6px; }
            .content::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
            
            /* 學習狀態卡片 */
            .study-card {
                background: var(--paper);
                border-radius: 16px;
                padding: 20px;
                margin-bottom: 14px;
                border: 1px solid var(--line);
                animation: fadeUp 0.3s;
            }
            
            @keyframes fadeUp {
                from { opacity: 0; transform: translateY(10px); }
                to { opacity: 1; transform: translateY(0); }
            }
            
            .study-header {
                display: flex;
                align-items: center;
                gap: 12px;
                margin-bottom: 14px;
            }
            
            .study-emoji {
                font-size: 36px;
                line-height: 1;
            }
            
            .study-name {
                font-family: 'Noto Serif TC', serif;
                font-weight: 700;
                font-size: 20px;
                color: var(--ink);
            }
            
            .study-section {
                font-family: 'DM Mono', monospace;
                font-size: 10px;
                letter-spacing: 0.2em;
                color: var(--accent);
                text-transform: uppercase;
            }
            
            /* 解鎖前狀態 */
            .locked-panel {
                text-align: center;
                padding: 30px 16px;
                background: linear-gradient(180deg, var(--accent-light), #faf3e6);
                border-radius: 16px;
                margin-bottom: 14px;
                border: 1px dashed var(--accent-soft);
            }
            
            .locked-icon {
                font-size: 44px;
                margin-bottom: 10px;
            }
            
            .locked-text {
                font-family: 'Noto Serif TC', serif;
                font-size: 14px;
                color: var(--ink-mid);
                margin-bottom: 18px;
                line-height: 1.6;
            }
            
            /* 解鎖／製作按鈕 */
            .action-row {
                display: flex;
                gap: 8px;
                margin-top: 12px;
            }
            
            .btn {
                flex: 1;
                padding: 12px 14px;
                border: none;
                border-radius: 10px;
                font-family: 'Noto Serif TC', serif;
                font-weight: 700;
                font-size: 13.5px;
                cursor: pointer;
                transition: all 0.2s;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 6px;
            }
            
            .btn-primary {
                background: var(--accent);
                color: white;
                box-shadow: 0 4px 12px rgba(200,129,58,0.3);
            }
            .btn-primary:hover {
                background: var(--ink);
                transform: translateY(-1px);
            }
            
            .btn-secondary {
                background: var(--paper);
                color: var(--ink);
                border: 1px solid var(--line);
            }
            .btn-secondary:hover {
                background: var(--bg);
                border-color: var(--accent-soft);
            }
            
            .btn-success {
                background: var(--green);
                color: white;
            }
            
            /* 進度條 */
            .progress-row {
                display: flex;
                align-items: center;
                gap: 10px;
                margin-bottom: 4px;
            }
            
            .progress-label {
                font-family: 'DM Mono', monospace;
                font-size: 11px;
                letter-spacing: 0.1em;
                color: var(--ink-soft);
                font-weight: 600;
            }
            
            .progress-count {
                font-family: 'DM Mono', monospace;
                font-size: 14px;
                color: var(--accent);
                font-weight: 700;
                margin-left: auto;
            }
            
            .progress-bar {
                width: 100%;
                height: 8px;
                background: var(--bg);
                border-radius: 999px;
                overflow: hidden;
                margin-bottom: 12px;
                margin-top: 4px;
            }
            
            .progress-fill {
                height: 100%;
                background: linear-gradient(90deg, var(--accent), var(--gold));
                border-radius: 999px;
                transition: width 0.4s ease;
            }
            
            .progress-fill.done {
                background: linear-gradient(90deg, var(--green), #9bbf8c);
            }
            
            /* 學習徽章 */
            .completed-badge {
                background: linear-gradient(135deg, var(--green), #5d8a4f);
                color: white;
                padding: 14px;
                border-radius: 12px;
                text-align: center;
                margin-bottom: 12px;
                box-shadow: 0 6px 20px rgba(123,163,106,0.3);
            }
            
            .completed-badge .cb-icon {
                font-size: 32px;
                margin-bottom: 4px;
            }
            
            .completed-badge .cb-text {
                font-family: 'Noto Serif TC', serif;
                font-weight: 700;
                font-size: 15px;
            }
            
            /* 步驟區（與舊版類似）*/
            .recipe-steps {
                background: var(--paper);
                border-radius: 12px;
                padding: 14px 16px 16px;
                border: 1px solid var(--line);
                animation: fadeUp 0.3s;
            }
            
            .recipe-steps-title {
                font-family: 'DM Mono', monospace;
                font-size: 9px;
                letter-spacing: 0.3em;
                color: var(--accent);
                font-weight: 600;
                margin-bottom: 10px;
                display: flex;
                align-items: center;
                gap: 5px;
            }
            
            .step-ol {
                list-style: none;
                counter-reset: step;
                display: flex;
                flex-direction: column;
                gap: 3px;
            }
            
            .step-ol li {
                counter-increment: step;
                display: flex;
                align-items: flex-start;
                gap: 9px;
                font-size: 13.5px;
                padding: 3px 0;
                line-height: 1.55;
                color: var(--ink-mid);
            }
            
            .step-ol li::before {
                content: counter(step);
                background: var(--accent);
                color: white;
                min-width: 20px;
                height: 20px;
                border-radius: 50%;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                font-family: 'DM Mono', monospace;
                font-size: 10px;
                font-weight: 600;
                flex-shrink: 0;
                margin-top: 1px;
            }
            
            .step-ol li b { color: var(--ink); font-weight: 600; }
            .step-ol li small { color: var(--ink-soft); font-size: 11px; }
            
            .note {
                margin-top: 10px;
                padding: 8px 12px;
                background: var(--accent-light);
                border-left: 3px solid var(--accent);
                font-size: 12px;
                color: var(--ink-mid);
                border-radius: 0 6px 6px 0;
            }
            
            /* 沒有步驟 */
            .no-steps {
                padding: 24px 20px;
                background: var(--paper);
                border-radius: 12px;
                border: 1px dashed var(--line);
                text-align: center;
                color: var(--ink-soft);
                font-size: 13px;
            }
            
            /* ============ 學習儀表板 ============ */
            .dash {
                padding: 16px;
            }
            
            .dash-card {
                background: var(--paper);
                border-radius: 16px;
                padding: 18px;
                margin-bottom: 12px;
                border: 1px solid var(--line);
            }
            
            .dash-greeting {
                text-align: center;
                padding: 18px 16px 22px;
                background: linear-gradient(135deg, var(--accent-light), #faf3e6);
                border-radius: 18px;
                margin-bottom: 14px;
                border: 1px solid var(--accent-soft);
            }
            
            .greeting-icon {
                font-size: 38px;
                margin-bottom: 6px;
            }
            
            .greeting-name {
                font-family: 'DM Serif Display', serif;
                font-size: 22px;
                color: var(--ink);
                margin-bottom: 2px;
            }
            
            .greeting-role {
                font-family: 'Noto Serif TC', serif;
                font-size: 12px;
                color: var(--ink-soft);
                letter-spacing: 0.2em;
            }
            
            /* 階段時間軸 */
            .stages {
                display: flex;
                flex-direction: column;
                gap: 0;
            }
            
            .stage-row {
                display: flex;
                gap: 12px;
                padding: 10px 0;
                border-bottom: 1px dashed var(--line-soft);
                position: relative;
            }
            
            .stage-row:last-child { border-bottom: none; }

<script>

// ============ 雲端同步設定 ============
// 1. 先把 apps-script/Code.gs 貼到 Google Sheets 的 Apps Script
// 2. 部署成 Web App 後，把得到的 /exec 網址貼到 DEFAULT_CLOUD_API_URL
// 3. 或在網站右上角雲端按鈕臨時設定網址
const GOOGLE_SHEET_ID = '1-CUx0JAM09kjVHm395MAHImWqlN1-Y9F2ePd3YcP0uo';
const DEFAULT_CLOUD_API_URL = 'https://script.google.com/macros/s/AKfycbysxT58NCzQsV49ENNYMFJZMcQEZ5g7EI6rU8YlrPnViE_8hh3tWMVoE1FgRTP43gIY/exec';
const CLOUD_API_URL = localStorage.getItem('km_api_url') || DEFAULT_CLOUD_API_URL;
const CLOUD_ENABLED = !!CLOUD_API_URL && CLOUD_API_URL.startsWith('https://script.google.com');

async function cloudCall(action, params = {}) {
  if (!CLOUD_ENABLED) return { ok: false, msg: '雲端未設定' };
  try {
    const res = await fetch(CLOUD_API_URL, {
      method: 'POST',
      mode: 'cors',
      // Apps Script 不支援自訂 header，用 text/plain 避免 preflight
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, ...params }),
      redirect: 'follow',
    });
    if (!res.ok) return { ok: false, msg: 'HTTP ' + res.status };
    return await res.json();
  } catch (err) {
    console.error('Cloud sync error:', err);
    return { ok: false, msg: err.message };
  }
}

function applyCloudSync(sync, userId) {
  if (!sync || !sync.ok) return;

  if (sync.users) {
    saveUsers(sync.users.map(u => ({ ...u, password: u.password || '' })));
  }

  const allProg = store.get(STORAGE_KEYS.PROGRESS, {});
  if (sync.progressByUser) {
    Object.assign(allProg, sync.progressByUser);
    store.set(STORAGE_KEYS.PROGRESS, allProg);
  } else if (sync.progress) {
    allProg[userId] = sync.progress;
    store.set(STORAGE_KEYS.PROGRESS, allProg);
  }

  if (sync.messages) {
    const msgs = sync.messages.map(m => ({
      id: m.id,
      from: m.fromUserId,
      to: m.toUserId,
      text: m.text,
      type: m.type,
      ts: Number(m.ts),
    }));
    store.set(STORAGE_KEYS.MESSAGES, msgs);
  }

  if (sync.tasks) store.set(STORAGE_KEYS.TASKS, sync.tasks);
  if (sync.unlockLog) store.set(STORAGE_KEYS.UNLOCK_LOG, sync.unlockLog);
  if (sync.badges) store.set('km_badges_v1', sync.badges);
}

// 設定雲端 URL
function setCloudUrl(url) {
  if (!url || !url.startsWith('https://script.google.com')) {
    alert('請輸入正確的 Apps Script Web App 網址（以 https://script.google.com 開頭）');
    return false;
  }
  localStorage.setItem('km_api_url', url);
  alert('✅ 雲端同步已啟用，重新整理頁面後生效');
  location.reload();
  return true;
}

// 顯示設定面板
window.showCloudSettings = function() {
  const current = localStorage.getItem('km_api_url') || '';
  const newUrl = prompt(
    '請輸入 Apps Script Web App 網址：\n（部署 Web App 後得到的 URL）\n\n清空可關閉雲端同步。',
    current
  );
  if (newUrl === null) return;
  if (newUrl === '') {
    localStorage.removeItem('km_api_url');
    alert('已關閉雲端同步');
    location.reload();
  } else {
    setCloudUrl(newUrl.trim());
  }
};

// ============ 資料層（localStorage）============
const STORAGE_KEYS = {
  USERS: 'km_users_v1',
  CURRENT: 'km_current_v1',
  PROGRESS: 'km_progress_v1', // {userId: {itemId: {count, completed}}}（無 unlocked，每次都會重置）
  MESSAGES: 'km_messages_v1', // [{from, to, text, ts, type}]
  TASKS: 'km_tasks_v1', // {userId: {date: [{text, done}]}}
  UNLOCK_LOG: 'km_unlock_log_v1', // {userId: {date: {variantKey: count}}} 每日解鎖記錄
};

// 本次畫面上的解鎖狀態（切到其他品項就會消失）
const SESSION_UNLOCKED = new Set();

const STAGES = [
  { id: 1, name: '服務小金人', emoji: '🛎️', desc: '帶位、給茶水、菜單說明', sections: [] },

  get(k, def) {

let currentUser = null;

function getUsers() { return store.get(STORAGE_KEYS.USERS, []); }
function saveUsers(u) { store.set(STORAGE_KEYS.USERS, u); }

async function login(username, password, role) {
  if (CLOUD_ENABLED) {
    const result = await cloudCall('login', { username, password, role });
    if (result.ok) {
      // 同步到本地
      const users = getUsers();
      const idx = users.findIndex(u => u.id === result.user.id);
      if (idx >= 0) users[idx] = result.user;
      else users.push(result.user);
      saveUsers(users);
      store.set(STORAGE_KEYS.CURRENT, result.user.id);
      
      const sync = await cloudCall('syncAll', { userId: result.user.id });
      applyCloudSync(sync, result.user.id);
    }
    return result;
  }
  
  // 本地
  const users = getUsers();
  const user = users.find(u => u.username === username && u.role === role);
  if (!user) return { ok: false, msg: '使用者不存在' };
  if (user.password !== password) return { ok: false, msg: '密碼錯誤' };
  store.set(STORAGE_KEYS.CURRENT, user.id);
  return { ok: true, user };
}

async function register(username, password, role) {
  if (!username || !password) return { ok: false, msg: '請填寫所有欄位' };
  
  // 優先用雲端
  if (CLOUD_ENABLED) {
    const result = await cloudCall('register', { username, password, role });
    if (result.ok) {
      const users = getUsers();
      const idx = users.findIndex(u => u.id === result.user.id);
      if (idx >= 0) users[idx] = result.user;
      else users.push(result.user);
      saveUsers(users);
      store.set(STORAGE_KEYS.CURRENT, result.user.id);
      const sync = await cloudCall('syncAll', { userId: result.user.id });
      applyCloudSync(sync, result.user.id);
    }
    return result;
  }
  
  // 本地
  const users = getUsers();
  if (users.some(u => u.username === username && u.role === role)) {
    return { ok: false, msg: '此名稱已被註冊' };
  }
  const user = {
    id: 'u_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
    username, password, role,
    stage: 1,
    createdAt: Date.now(),
  };
  users.push(user);
  saveUsers(users);
  store.set(STORAGE_KEYS.CURRENT, user.id);
  return { ok: true, user };
}

function logout() {
  localStorage.removeItem(STORAGE_KEYS.CURRENT);
  currentUser = null;
  location.reload();
}

function getCurrentUser() {
  const id = store.get(STORAGE_KEYS.CURRENT, null);

  const users = getUsers();

}

// ============ 學習進度 ============
function getProgress(userId) {
  const all = store.get(STORAGE_KEYS.PROGRESS, {});
  return all[userId] || {};
}

function saveProgress(userId, prog) {
  const all = store.get(STORAGE_KEYS.PROGRESS, {});
  all[userId] = prog;
  store.set(STORAGE_KEYS.PROGRESS, all);
}

function getItemProgress(userId, itemId) {
  const prog = getProgress(userId);
  return prog[itemId] || { unlocked: false, count: 0, completed: false, unlockedAt: null };
}

function unlockItem(userId, itemId) {
  const prog = getProgress(userId);
  if (!prog[itemId]) {
    prog[itemId] = { unlocked: true, count: 1, completed: false, unlockedAt: Date.now() };
  }
  saveProgress(userId, prog);
  // 雲端同步（非阻塞）
  if (CLOUD_ENABLED) {
    cloudCall('updateProgress', {
      userId, itemId,
      unlocked: true,
      count: prog[itemId].count,
      completed: prog[itemId].completed,
    });
  }
}

function incrementMake(userId, itemId) {
  const prog = getProgress(userId);
  if (!prog[itemId]) {
    prog[itemId] = { unlocked: true, count: 0, completed: false, unlockedAt: Date.now() };
  }
  prog[itemId].count += 1;
  if (prog[itemId].count >= COMPLETE_TARGET) {
    prog[itemId].completed = true;
  }
  saveProgress(userId, prog);
  if (CLOUD_ENABLED) {
    cloudCall('updateProgress', {
      userId, itemId,
      unlocked: true,
      count: prog[itemId].count,
      completed: prog[itemId].completed,
    });
  }
}

// ===== 手冊 =====
function renderTabs() {
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  
  MANUAL.sections.forEach(sec => {
    const tab = document.createElement('button');
    tab.className = 'tab' + (sec.id === currentSection ? ' active' : '');
    tab.dataset.target = sec.id;
    const count = MANUAL.items.filter(i => i.section_id === sec.id).length;
    tab.innerHTML = `<span class="tab-emoji">${sec.icon}</span>${sec.title}<span class="tab-count">${count}</span>`;
    tab.addEventListener('click', () => selectSection(sec.id));
    tabsEl.appendChild(tab);
  });
}

function selectSection(secId) {
  currentSection = secId;
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.target === secId);
    if (t.dataset.target === secId) {
      t.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    }
  });
  
  renderItemsList();
  
  const items = MANUAL.items.filter(i => i.section_id === secId);
  if (items.length) selectItem(items[0].idx);
  else document.getElementById('content').innerHTML = '';
}

function renderItemsList() {
  const list = document.getElementById('items-list');
  list.innerHTML = '';
  
  const items = MANUAL.items.filter(i => i.section_id === currentSection);
  items.forEach(item => {
    // 加總所有變體
    const variants = getItemVariants(item);
    let totalCount = 0;
    let sessionUnlockedCount = 0;
    variants.forEach(v => {
      const variantKey = item.idx + '__' + v.key;
      const p = getItemProgress(currentUser.id, variantKey);
      totalCount += p.count || 0;
      if (SESSION_UNLOCKED.has(variantKey)) sessionUnlockedCount++;
    });
    const isSessionLearning = sessionUnlockedCount > 0;
    
    const chip = document.createElement('button');
    chip.className = 'item-chip';
    if (item.idx === currentItem) chip.classList.add('active');
    if (currentUser.role === 'student' && isSessionLearning) chip.classList.add('learning');
    chip.dataset.idx = item.idx;
    
    let statusIcon = '';
    if (currentUser.role === 'student' && totalCount > 0) {
      statusIcon = `<span class="ic-count">${totalCount}</span>`;
    }
    
    chip.innerHTML = `
      <span class="ic-emoji">${item.emoji}</span>
      <span class="ic-name">${item.name}</span>
      ${statusIcon}
    `;
    
    chip.addEventListener('click', () => selectItem(item.idx));
    list.appendChild(chip);
  });
  
  list.scrollLeft = 0;
}

function selectItem(itemIdx) {
  if (currentItem && currentItem !== itemIdx) {
    SESSION_UNLOCKED.clear();
  }
  currentItem = itemIdx;
  const item = MANUAL.items.find(i => i.idx === itemIdx);
  if (!item) return;
  
  document.querySelectorAll('.item-chip').forEach(c => {
    c.classList.toggle('active', c.dataset.idx === itemIdx);
    if (c.dataset.idx === itemIdx) {
      c.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    }
  });
  
  renderItemContent(item);
}

function renderItemContent(item) {
  const sec = MANUAL.sections.find(s => s.id === item.section_id);
  const content = document.getElementById('content');
  content.scrollTop = 0;
  
  // 判斷品項有哪些版本（冰/熱）
  const variants = getItemVariants(item);
  
  let html = `
    <div class="study-card">
      <div class="study-header">
        <span class="study-emoji">${item.emoji}</span>
        <div>
          <div class="study-section">${sec.icon} ${sec.title}</div>
          <div class="study-name">${item.name}</div>
        </div>
      </div>
    </div>
  `;
  
  // 保姆角色：只看內容、不顯示按鈕
  if (currentUser.role === 'teacher') {
    html += renderItemSteps(item);
    content.innerHTML = html;
    return;
  }
  
  // === 學員：每個變體（冰/熱）各自顯示 ===
  variants.forEach(v => {
    const variantKey = item.idx + '__' + v.key;  // 例：xxx-1__ice
    const prog = getItemProgress(currentUser.id, variantKey);
    
    let variantLabel = '';
    if (v.key === 'ice') variantLabel = '<span class="v-tag v-ice">🧊 冰</span>';
    else if (v.key === 'hot') variantLabel = '<span class="v-tag v-hot">🔥 熱</span>';
    else variantLabel = '<span class="v-tag v-only">📋 製作</span>';
    
    // 變體卡片
    html += `<div class="variant-card">`;
    
    // 變體頭
    html += `
      <div class="variant-head">
        ${variantLabel}
        <span class="v-progress">累計 ${prog.count} 次</span>
      </div>
    `;
    
    // 進度條（累積次數視覺）
    if (prog.count > 0) {
      const pct = Math.min(100, (prog.count / COMPLETE_TARGET) * 100);
      html += `<div class="progress-bar" style="margin:8px 0 4px;"><div class="progress-fill" style="width:${pct}%"></div></div>`;
    }
    
    // 解鎖狀態改成 session-level（每次打開都會鎖回去）
    const sessionUnlocked = SESSION_UNLOCKED.has(variantKey);
    
    if (sessionUnlocked) {
      // 本次已解鎖：顯示步驟
      html += `<div class="variant-steps" style="margin-top:10px;">${v.html}</div>`;
    } else {
      // 未解鎖：顯示鎖定提示
      html += `
        <div style="background:var(--accent-light);border:1px dashed var(--accent-soft);border-radius:10px;padding:14px;text-align:center;margin-top:10px;font-size:13px;color:var(--ink-mid);">
          🔒 製作步驟目前鎖定<br><small style="color:var(--ink-soft);">切換到其他品項後會自動鎖回來，方便記錄哪些內容需要重新解鎖學習。</small>
        </div>
      `;
    }

    html += `
      <div class="action-row" style="margin-top:10px;">
        <button class="btn btn-primary" onclick="handleUnlockVariant('${item.idx}', '${v.key}')">
          🔓 解鎖並記錄 +1
        </button>
        <button class="btn btn-secondary" onclick="handleMakePlusVariant('${item.idx}', '${v.key}')">
          ✅ 不用解鎖，記錄 +1
        </button>
      </div>
    `;
    
    html += `</div>`;
  });
  
  content.innerHTML = html;
}

// 取得品項的變體列表（冰/熱/單一）
function getItemVariants(item) {
  if (!item.has_steps || !item.content_html) {
    return [{ key: 'only', html: `<div class="no-steps">📋 暫無詳細製作步驟</div>` }];
  }
  
  const content = item.content_html;
  const tags = (item.tags || []).join(' ');
  
  // 用 DOM 解析（比 regex 可靠）
  const tmp = document.createElement('div');
  tmp.innerHTML = content;
  
  const iceBlock = tmp.querySelector('.duo-step-ice');
  const hotBlock = tmp.querySelector('.duo-step-hot');
  
  // 完整冰熱對照
  if (iceBlock && hotBlock) {
    // 取共用的 pattern-box / flavor-pick
    const patternBox = tmp.querySelector('.pattern-box');
    const flavorPick = tmp.querySelector('.flavor-pick');
    
    let sharedHead = '';
    if (patternBox) sharedHead += patternBox.outerHTML;
    if (flavorPick) sharedHead += flavorPick.outerHTML;
    
    return [
      { key: 'ice', html: sharedHead + iceBlock.outerHTML },
      { key: 'hot', html: sharedHead + hotBlock.outerHTML },
    ];
  }
  
  // 從 tags 判斷
  const tagIce = tags.includes('tag-ice');
  const tagHot = tags.includes('tag-hot');
  
  if (tagIce && !tagHot) return [{ key: 'ice', html: content }];
  if (tagHot && !tagIce) return [{ key: 'hot', html: content }];
  if (tagIce && tagHot) {
    // 冰熱都有 tag 但內容沒拆 — 整份內容當「製作」
    return [{ key: 'only', html: content }];
  }
  
  return [{ key: 'only', html: content }];
}

// 不用解鎖，直接記錄製作 +1
window.handleMakePlusVariant = function(itemId, variantKey) {
  const fullKey = itemId + '__' + variantKey;
  const beforeProg = getItemProgress(currentUser.id, fullKey);
  const wasMaster = beforeProg.count >= COMPLETE_TARGET;
  
  incrementVariantMake(currentUser.id, fullKey, false);
  
  renderItemsList();
  renderUserChip(); // 更新右上角 XP
  
  const item = MANUAL.items.find(i => i.idx === itemId);
  if (item) {
    const prog = getItemProgress(currentUser.id, fullKey);
    
    // 第一次達成 50 次 → 頒發製作高手徽章
    if (!wasMaster && prog.count >= COMPLETE_TARGET) {
      grantMasterBadge(currentUser.id, fullKey, item, variantKey);
      showBadgeToast(item, variantKey);
    }
    
    renderItemContent(item);
  }
};

// 解鎖步驟，並記錄製作 +1
window.handleUnlockVariant = function(itemId, variantKey) {
  const fullKey = itemId + '__' + variantKey;
  const beforeProg = getItemProgress(currentUser.id, fullKey);
  const wasMaster = beforeProg.count >= COMPLETE_TARGET;
  
  incrementVariantMake(currentUser.id, fullKey, true);
  renderItemsList();
  renderUserChip();
  
  const item = MANUAL.items.find(i => i.idx === itemId);
  if (item) {
    const prog = getItemProgress(currentUser.id, fullKey);
    if (!wasMaster && prog.count >= COMPLETE_TARGET) {
      grantMasterBadge(currentUser.id, fullKey, item, variantKey);
      showBadgeToast(item, variantKey);
    }
    renderItemContent(item);
  }
};

// 頒發製作高手徽章
function grantMasterBadge(userId, variantKey, item, vKey) {
  const badges = store.get('km_badges_v1', {});
  if (!badges[userId]) badges[userId] = [];
  
  // 已經有了就不重複
  if (badges[userId].some(b => b.variantKey === variantKey)) return;
  
  const variantSuffix = vKey === 'ice' ? '冰' : vKey === 'hot' ? '熱' : '';
  const badgeName = `${item.name}${variantSuffix ? '（'+variantSuffix+'）' : ''} 製作高手`;
  
  const badge = {
    variantKey,
    badgeName,
    itemName: item.name,
    itemEmoji: item.emoji,
    variant: vKey,
    earnedAt: Date.now(),
  };
  badges[userId].push(badge);
  store.set('km_badges_v1', badges);

  if (CLOUD_ENABLED) {
    cloudCall('addBadge', { userId, ...badge });
  }
  
  // 訊息給保姆
  addMessage('system', 'all', `🏆 ${currentUser.username} 獲得「${badgeName}」徽章！`, 'system');
}

// 跳出徽章獲得通知（彈窗）
function showBadgeToast(item, vKey) {
  const variantSuffix = vKey === 'ice' ? '（冰）' : vKey === 'hot' ? '（熱）' : '';
  const toast = document.createElement('div');
  toast.className = 'badge-toast';
  toast.innerHTML = `
    <div class="bt-glow"></div>

function incrementVariantMake(userId, variantKey, isUnlock) {
  const prog = getProgress(userId);
  const ts = Date.now();
  if (!prog[variantKey]) {
    prog[variantKey] = { count: 0, completed: false, unlocked: false, unlockedAt: null };
  }
  if (isUnlock && !prog[variantKey].unlockedAt) {
    prog[variantKey].unlocked = true;
    prog[variantKey].unlockedAt = ts;
  }
  prog[variantKey].count += 1;
  if (prog[variantKey].count >= COMPLETE_TARGET) {
    prog[variantKey].completed = true;
  }
  saveProgress(userId, prog);
  
  // 只有「解鎖」按鈕會讓目前品項顯示步驟；不用解鎖 +1 不會打開步驟
  if (isUnlock) SESSION_UNLOCKED.add(variantKey);
  
  // 解鎖動作記錄到今日 unlock log
  if (isUnlock) {
    const today = todayStr();
    const log = store.get(STORAGE_KEYS.UNLOCK_LOG, {});
    if (!log[userId]) log[userId] = {};
    if (!log[userId][today]) log[userId][today] = {};
    log[userId][today][variantKey] = (log[userId][today][variantKey] || 0) + 1;
    store.set(STORAGE_KEYS.UNLOCK_LOG, log);
  }
  
  if (CLOUD_ENABLED) {
    const parts = variantKey.split('__');
    const itemId = parts[0];
    const variant = parts[1] || 'only';
    const item = MANUAL.items.find(i => i.idx === itemId) || {};
    const section = MANUAL.sections.find(s => s.id === item.section_id) || {};

    cloudCall('updateProgress', {
      userId, itemId: variantKey,
      count: prog[variantKey].count,
      completed: prog[variantKey].completed,
      unlocked: !!prog[variantKey].unlocked,
      unlockedAt: prog[variantKey].unlockedAt,
    });
    cloudCall('logLearningEvent', {
      userId,
      action: isUnlock ? 'unlock' : 'make',
      itemId,
      variantKey,
      variant,
      itemName: item.name || '',
      sectionId: item.section_id || '',
      sectionTitle: section.title || item.section_title || '',
      countAfter: prog[variantKey].count,
      completed: prog[variantKey].completed,
      ts,
    });
    if (isUnlock) {
      cloudCall('logUnlock', { userId, variantKey, date: todayStr(), ts });
    }
  }
}

// 計算階段完成度（依該階段所有品項冰熱版本 × 50 為總分）
function calcStageProgress(stageId) {
  const stage = STAGES.find(s => s.id === stageId);
  if (!stage || stage.sections.length === 0) return { totalMakes: 0, targetMakes: 0, pct: 0 };
  
  const prog = getProgress(currentUser.id);
  let totalMakes = 0;
  let targetMakes = 0;
  
  // 撈該階段所有品項的變體
  MANUAL.items.forEach(item => {
    if (!stage.sections.includes(item.section_id)) return;
    const variants = getItemVariants(item);
    variants.forEach(v => {
      const key = item.idx + '__' + v.key;
      targetMakes += COMPLETE_TARGET;
      const p = prog[key];
      if (p) totalMakes += Math.min(p.count || 0, COMPLETE_TARGET);
    });
  });
  
  return {
    totalMakes,
    targetMakes,
    pct: targetMakes > 0 ? Math.round((totalMakes / targetMakes) * 100) : 0,
  };
}

  // 訊息
  const allMsgs = getMessages();
  const studentMsgs = allMsgs.filter(m => 
    (m.from === student.id || m.to === student.id || m.to === 'all') &&
    m.type !== 'system'
  ).sort((a,b) => a.ts - b.ts);
  
  // 任務
  const today = todayStr();
  const tasks = getTasks(student.id, today);
  
  let html = `<div class="dash">
    <button class="btn btn-secondary" style="margin-bottom:12px;" onclick="currentStudent=null;renderStudentList()">← 返回列表</button>
    
    <div class="dash-greeting">
      <div class="greeting-icon">🧑‍🍳</div>
      <div class="greeting-name">${student.username}</div>
      <div class="greeting-role">${STAGES[student.stage-1].name}</div>
    </div>
    
    <div class="stats-grid">
      <div class="stat-cell"><div class="stat-num">${unlocked}</div><div class="stat-label">已解鎖</div></div>
      <div class="stat-cell"><div class="stat-num">${completed}</div><div class="stat-label">已完成</div></div>
      <div class="stat-cell"><div class="stat-num">${totalMakes}</div><div class="stat-label">總製作</div></div>
    </div>
    
    <div class="dash-card">
      <div class="section-h">🪜 調整階段</div>
      <div style="display:flex;flex-direction:column;gap:6px;">
  `;
  
  STAGES.forEach(s => {
    const isCurrent = s.id === student.stage;
    html += `
      <button class="btn ${isCurrent?'btn-primary':'btn-secondary'}" style="justify-content:flex-start;text-align:left;" onclick="setStudentStage('${student.id}', ${s.id})">
        ${s.emoji} ${s.id}. ${s.name} ${isCurrent?'(目前)':''}
      </button>
    `;
  });
  html += `</div></div>`;
  
  // 今日任務管理
  html += `
    <div class="dash-card">
      <div class="section-h">📌 今日任務（${today}）</div>
      <div id="task-list">
        ${tasks.length === 0 
          ? `<div class="empty" style="padding:14px;"><div style="opacity:0.5;">尚未安排任務</div></div>`
          : tasks.map((t, i) => `
            <div class="task-row">
              <div class="task-check ${t.done?'done':''}">${t.done?'✓':''}</div>
              <div class="task-text ${t.done?'done':''}">${t.text}</div>
              <button class="icon-btn" onclick="removeTask('${student.id}', ${i})">×</button>
            </div>
          `).join('')
        }
      </div>
      <div class="msg-input-row">
        <input class="msg-input" id="task-input" placeholder="新增任務..." style="min-height:0;height:44px;">
        <button class="send-btn" onclick="addTask('${student.id}')">新增</button>
      </div>
    </div>
  `;
  
  // 聯絡簿
  html += `
    <div class="dash-card">
      <div class="section-h">📓 聯絡簿</div>
      <div class="msg-list">
  `;
  if (studentMsgs.length === 0) {
    html += `<div class="empty"><div class="empty-icon">💬</div>還沒有訊息</div>`;
  } else {
    studentMsgs.forEach(m => {
      const fromUser = getUsers().find(u => u.id === m.from);
      const fromName = fromUser ? fromUser.username : '系統';
      const fromRole = fromUser ? fromUser.role : 'system';
      const isStudent = m.from === student.id;
      const cls = isStudent ? 'from-student' : 'from-teacher';
      const date = new Date(m.ts).toLocaleString('zh-TW', {month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
      html += `
        <div class="msg-item ${cls}">
          <div class="msg-head">
            <span class="msg-author">${fromRole==='teacher'?'👩‍🏫':'🧑‍🍳'} ${fromName}</span>
            <span>${date}</span>
          </div>
          <div class="msg-body">${m.text}</div>
        </div>
      `;
    });
  }
  html += `</div>
      <div class="msg-input-row">
        <textarea class="msg-input" id="msg-input" placeholder="給 ${student.username} 留言..."></textarea>
        <button class="send-btn" onclick="sendToStudent('${student.id}')">送出</button>
      </div>
    </div>
  </div>`;
  
  content.innerHTML = html;
}

window.setStudentStage = function(studentId, stage) {
  const users = getUsers();
  const u = users.find(u => u.id === studentId);
  if (u) {
    u.stage = stage;
    saveUsers(users);
    if (CLOUD_ENABLED) cloudCall('updateUser', { userId: studentId, stage });
    renderStudentDetail();
  }
};

window.addTask = function(studentId) {
  const input = document.getElementById('task-input');
  const text = input.value.trim();
  if (!text) return;
  const today = todayStr();
  const tasks = getTasks(studentId, today);
  tasks.push({ text, done: false });
  setTasks(studentId, today, tasks);
  input.value = '';
  renderStudentDetail();
};

window.removeTask = function(studentId, idx) {
  const today = todayStr();
  const tasks = getTasks(studentId, today);
  tasks.splice(idx, 1);
  setTasks(studentId, today, tasks);
  renderStudentDetail();
};

window.sendToStudent = function(studentId) {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text) return;
  addMessage(currentUser.id, studentId, text);
  input.value = '';
  renderStudentDetail();
};

// 登出按鈕
document.getElementById('cloud-btn').addEventListener('click', () => {
  window.showCloudSettings();
});

document.getElementById('logout-btn').addEventListener('click', () => {
  if (confirm('確定要登出嗎？')) logout();
});
</script>

<!-- ===== PWA Service Worker 註冊 ===== -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').then((reg) => {
        // 偵測到新版本時，詢問是否立即更新
        reg.addEventListener('updatefound', () => {
          const sw = reg.installing;
          if (!sw) return;
          sw.addEventListener('statechange', () => {
            if (sw.state === 'installed' && navigator.serviceWorker.controller) {
              if (confirm('手冊有新版本，要立即更新嗎？')) {
                sw.postMessage({ type: 'SKIP_WAITING' });
              }
            }
          });
        });
      }).catch((err) => console.warn('SW 註冊失敗', err));

      // 新版啟用後自動重新整理一次
      let reloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (reloading) return;
        reloading = true;
        window.location.reload();
      });
    });
  }
</script>
